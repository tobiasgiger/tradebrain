name: Update NQ Pause-Board Assessment

# Stündlich (cron) plus manuelles Triggern über die GitHub-Oberfläche.
on:
  schedule:
    # NQ-Handelswoche: Start Sonntag 22:00 CEST, danach alle 4h bis Freitag 18:00 CEST.
    # 4h-Raster = CEST 02/06/10/14/18/22 Uhr. Cron laeuft in UTC (CEST = UTC+2),
    # daher UTC 00/04/08/12/16/20. GitHub-Cron kann sich um einige Minuten verzoegern.
    # Hinweis: Im Winter (CET = UTC+1) verschieben sich die lokalen Zeiten um 1h;
    # bei Bedarf die UTC-Stunden dann um 1 zurueckstellen.
    - cron: '0 20 * * 0'              # So 22:00 CEST (Wochenstart)
    - cron: '0 0,4,8,12,16,20 * * 1-4' # Mo-Do, alle 4h (CEST 02/06/10/14/18/22)
    - cron: '0 0,4,8,12,16 * * 5'      # Fr bis 18:00 CEST (22:00 faellt weg)
  workflow_dispatch:

# Schreibrechte, damit der Workflow die aktualisierte status.json zurückcommitten kann.
permissions:
  contents: write
  deployments: read
  pages: write

# Verhindert, dass sich überlappende Läufe gegenseitig ins Gehege kommen.
concurrency:
  group: update-assessment
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Immer den bei Jobstart aktuellen Produktionszweig verwenden.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Assessment abrufen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: Modell über eine Repository-Variable überschreiben.
          ANTHROPIC_MODEL: ${{ vars.ANTHROPIC_MODEL }}
          # Optional: Push-Kanäle bei Eskalation nach ROT (leer = kein Push).
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Optional: Board-URL für Push-Links (Default im Skript hinterlegt).
          BOARD_URL: ${{ vars.BOARD_URL }}
          # Optional: Vorlauf-Fenster in Stunden vor High-Impact-Events (Default 2).
          EVENT_PRE_HOURS: ${{ vars.EVENT_PRE_HOURS }}
        run: node scripts/fetch-assessment.mjs

      - name: Committen & pushen, falls geändert
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain data/)" ]]; then
            base_sha="$(git rev-parse HEAD)"
            remote_sha="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [[ "$remote_sha" != "$base_sha" ]]; then
              echo "FEHLER: origin/main wurde seit dem Checkout geändert ($base_sha -> $remote_sha). Kein Push; niemals Force-Push." >&2
              exit 1
            fi
            git add data/
            git commit -m "chore: update assessment $(date -u +%Y-%m-%dT%H:%MZ)"
            pushed_sha="$(git rev-parse HEAD)"
            if ! git push origin HEAD:main; then
              echo "FEHLER: Push nach main fehlgeschlagen (möglicher paralleler Commit). Kein Force-Push." >&2
              exit 1
            fi
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pushed_sha=$pushed_sha" >> "$GITHUB_OUTPUT"
          else
            echo "Keine Änderung in data/ — nichts zu committen."
          fi

      - name: GitHub Pages Build anfordern & Revision verifizieren
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ steps.commit.outputs.pushed_sha }}
        run: |
          echo "Fordere expliziten Pages-Build für $EXPECTED_SHA an."
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds" >/dev/null

          for attempt in $(seq 1 24); do
            deployments="$(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&sha=$EXPECTED_SHA&per_page=10")"
            deployment_id="$(jq -r '.[0].id // empty' <<<"$deployments")"
            deployment_state="unbekannt"
            if [[ -n "$deployment_id" ]]; then
              statuses="$(gh api "repos/$GITHUB_REPOSITORY/deployments/$deployment_id/statuses")"
              deployment_state="$(jq -r '.[0].state // "unbekannt"' <<<"$statuses")"
            fi
            echo "Pages-Prüfung $attempt/24: deployment=${deployment_id:-ausstehend} status=$deployment_state revision=$EXPECTED_SHA"

            if [[ "$deployment_state" == "success" ]]; then
              echo "Pages-Publikation für $EXPECTED_SHA bestätigt."
              exit 0
            fi
            if [[ "$deployment_state" == "failure" || "$deployment_state" == "error" ]]; then
              echo "FEHLER: Pages-Deployment für $EXPECTED_SHA hat Status $deployment_state." >&2
              exit 1
            fi
            sleep 10
          done

          echo "FEHLER: Pages-Publikation für $EXPECTED_SHA konnte nicht bestätigt werden." >&2
          exit 1
